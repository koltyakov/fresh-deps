name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - name: Use pinned npm
        run: npm install -g npm@$(node -p "require('./package.json').volta.npm") --no-audit --no-fund
      - run: npm ci
      - run: npm run check
      - run: npm run lint:check
      - run: npm run fmt:check
      - run: npm test
      - run: npm run build
